services:
  - type: web
    name: facebook-page-operations-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APPLICATION_MODE
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTOMATION_ENABLED
        value: "false"
      - key: PUBLISH_MODE
        value: dry_run
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: MAX_IMAGE_PIXELS
        value: "40000000"
      - key: SUPABASE_STORAGE_BUCKET
        value: post-images
      - key: FACEBOOK_GRAPH_API_VERSION
        value: v26.0
      - key: FACEBOOK_REQUEST_TIMEOUT_SECONDS
        value: "10"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
