[build-system]
requires = ["setuptools>=78.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-operations-dashboard-backend"
version = "0.1.0"
description = "Local post-management and dry-run scheduling backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.2",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
